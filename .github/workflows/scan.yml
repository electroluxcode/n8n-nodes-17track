name: Scan community package

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run n8n community package scanner (same command as vetting)
        run: npx -y @n8n/scan-community-package@beta @creative-x-lab/n8n-nodes-17track@latest
