name: Release

on:
  push:
    branches: [main]

# Required for provenance-signed npm publish + GitHub Release creation
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: skip isolated-vm native build (types-only build needs no native modules)
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build node
        run: npm run build

      - name: Semantic release
        env:
          # Built-in token has contents:write on this repo — enough for tag + release commit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
